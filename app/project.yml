# =============================================================================
# XcodeGen 工程定义 —— 生成: xcodegen generate （在 app/ 目录执行）
# 纯代码 UIKit，无 storyboard；引擎静态库通过 OTHER_LDFLAGS 链接
# =============================================================================
name: GalPlayer
options:
  bundleIdPrefix: com.yg
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: "YES"
    # 越狱 App: 构建期不签名，ldid 在打包脚本里递归签名
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "2"          # iPad
    ONLY_ACTIVE_ARCH: "NO"
    ARCHS: "arm64"
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/GalPlayer/GalPlayer-Bridging-Header.h"
    INFOPLIST_FILE: "$(SRCROOT)/GalPlayer/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: com.yg.galplayer
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 引擎静态库
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/../build/ios/lib"
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../build/ios/include/SDL2"
      - "$(SRCROOT)/../build/ios/include"
      - "$(SRCROOT)/../build/ios/include/freetype2"
      - "$(SRCROOT)/../build/ios/include/jpeg"
    OTHER_LDFLAGS:
      - "-ObjC"
      - "-Wl,-all_load"
      - "-lc++"
      - "-lSDL2"
      - "-lons"
      - "-lfreetype"
      - "-ljpeg"
      - "-lvorbisfile"
      - "-lvorbis"
      - "-logg"
      - "-lSDL2_image"
      - "-lSDL2_ttf"
      - "-lSDL2_mixer"
      - "-lSDL2stdlib"
      - "-liconv"
      - "-lbz2"
      - "-lz"
      # 系统框架（xcodegen frameworks 键不生效时用显式传参）
      - "-framework"; "-CoreBluetooth"
      - "-framework"; "-GameController"
      - "-framework"; "-CoreMotion"
      - "-framework"; "-CoreHaptics"
      - "-framework"; "-CoreAudio"
      - "-framework"; "-AudioToolbox"
      - "-framework"; "-AVFoundation"
      - "-framework"; "-CoreMedia"
      - "-framework"; "-CoreGraphics"
      - "-framework"; "-QuartzCore"
      - "-framework"; "-CoreText"
      - "-framework"; "-CoreFoundation"
      - "-framework"; "-UIKit"
      - "-framework"; "-Foundation"
      - "-framework"; "-OpenGLES"
      - "-framework"; "-Metal"
      - "-framework"; "-MediaPlayer"
      - "-framework"; "-MobileCoreServices"
      - "-framework"; "-ImageIO"
    OTHER_CPLUSPLUSFLAGS:
      - "-std=c++14"

targets:
  GalPlayer:
    type: application
    platform: iOS
    sources:
      - path: GalPlayer
        excludes:
          - "Info.plist"
          - "Bridges/KrkrBridge.mm"   # KRKR 走独立 App，主 App 内不编译
    # SDL2 在 iOS 上需要的系统框架
    frameworks:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: OpenGLES.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreFoundation.framework
      - sdk: MobileCoreServices.framework
      - sdk: ImageIO.framework

  # KRKR 引擎独立 App（cocos2d-x + Kirikiroid2 核心，双 App 架构）
  Kirikinux2:
    type: application
    platform: iOS
    sources:
      - path: ../engines/kirikiroid2/ios_host/IOSMain.mm
        name: IOSMain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.kirikinux2
        INFOPLIST_FILE: "$(SRCROOT)/Kirikinux2-Info.plist"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ONLY_ACTIVE_ARCH: "NO"
        ARCHS: "arm64"
        CLANG_ENABLE_MODULES: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../build/ios/lib"
          - "$(SRCROOT)/../build/krkr-ios"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/ios/include/SDL2"
          - "$(SRCROOT)/../build/ios/include"
          - "$(SRCROOT)/../build/krkr-ios/include"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/src/core"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/cocos/kr2"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos/platform"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos/editor-support"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos/audio/include"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/extensions"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/external"
        OTHER_CPLUSPLUSFLAGS:
          - "-std=c++17"
          - "-DTJS_TEXT_OUT_CRLF"
          - "-D__STDC_CONSTANT_MACROS"
          - "-DUSE_UNICODE_FSTRING"
          - "-D_7ZIP_ST"
          - "-DLINUX"
          - "-DKR2_IOS"
        OTHER_LDFLAGS:
          - "-ObjC"
          - "-Wl,-all_load"
          - "-lc++"
          - "-lkrkr2core"
          - "-lkrkr2plugin"
          - "-lkrkr2plugin_ext"
          - "-lcocos2d"
          - "-lSDL2_image"
          - "-lSDL2_ttf"
          - "-lSDL2_mixer"
          - "-lSDL2stdlib"
          - "-lSDL2"
          - "-lfreetype"
          - "-lvorbisfile"
          - "-lvorbis"
          - "-logg"
          - "-liconv"
          - "-lz"
    frameworks:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: OpenGLES.framework
      - sdk: GLKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: OpenAL.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMotion.framework
      - sdk: CoreText.framework
      - sdk: CoreFoundation.framework
      - sdk: ImageIO.framework
      - sdk: MobileCoreServices.framework
      - sdk: GameKit.framework
