# =============================================================================
# XcodeGen 工程定义 —— 三个 App 目标
#   GalPlayer   纯 Swift UI 外壳（扫描/列表/设置，不含任何引擎代码）
#   OnsPlayer   ONScripter 播放器（SDL2 应用，独立生命周期）
#   Kirikinux2  Kirikiri2 播放器（cocos2d-x 应用，二期）
#
# 生成: xcodegen generate （在 app/ 目录执行）
# =============================================================================
name: GalPlayer
options:
  bundleIdPrefix: com.yg
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    ONLY_ACTIVE_ARCH: "NO"
    ARCHS: "arm64"
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/../build/ios/lib"
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../build/ios/include/SDL2"
      - "$(SRCROOT)/../build/ios/include"
      - "$(SRCROOT)/../build/ios/include/freetype2"
      - "$(SRCROOT)/../build/ios/include/jpeg"

targets:
  # ---------------------------------------------------------------- UI 外壳
  GalPlayer:
    type: application
    platform: iOS
    sources:
      - path: GalPlayer
        excludes:
          - "Info.plist"
          - "Bridges/**"        # 引擎桥接已迁移到各播放器 App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.galplayer
        INFOPLIST_FILE: "$(SRCROOT)/GalPlayer/Info.plist"
        TARGETED_DEVICE_FAMILY: "2"
        OTHER_LDFLAGS:
          - "-ObjC"
          - "-lc++"
    frameworks:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: MediaPlayer.framework

  # ------------------------------------------------------- ONScripter 播放器
  OnsPlayer:
    type: application
    platform: iOS
    sources:
      - path: OnsPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.onsplayer
        INFOPLIST_FILE: "$(SRCROOT)/OnsPlayer-Info.plist"
        TARGETED_DEVICE_FAMILY: "2"
        OTHER_CPLUSPLUSFLAGS:
          - "-std=c++14"
        OTHER_LDFLAGS:
          - "-ObjC"
          - "-Wl,-all_load"
          - "-lc++"
          - "-lSDL2"
          - "-lons"
          - "-lSDL2_image"
          - "-lSDL2_ttf"
          - "-lSDL2_mixer"
          - "-lfreetype"
          - "-ljpeg"
          - "-lvorbisfile"
          - "-lvorbis"
          - "-logg"
          - "-liconv"
          - "-lbz2"
          - "-lz"
          - "-framework"
          - "CoreBluetooth"
          - "-framework"
          - "GameController"
          - "-framework"
          - "CoreMotion"
          - "-framework"
          - "CoreHaptics"
          - "-framework"
          - "CoreAudio"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "OpenGLES"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MediaPlayer"
          - "-framework"
          - "MobileCoreServices"
          - "-framework"
          - "ImageIO"

  # --------------------------------------------------------- Kirikiri 播放器
  Kirikinux2:
    type: application
    platform: iOS
    sources:
      - path: ../engines/kirikiroid2/ios_host/IOSMain.mm
        name: IOSMain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.kirikinux2
        INFOPLIST_FILE: "$(SRCROOT)/Kirikinux2-Info.plist"
        TARGETED_DEVICE_FAMILY: "1,2"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../build/ios/lib"
          - "$(SRCROOT)/../build/krkr-ios"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/ios/include/SDL2"
          - "$(SRCROOT)/../build/ios/include"
          - "$(SRCROOT)/../build/krkr-ios/include"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/src/core"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/cocos/kr2"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos/platform"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos/editor-support"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/cocos/audio/include"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/extensions"
          - "$(SRCROOT)/../engines/kirikiroid2/Kirikinux2/third_party/cocos2d-x/external"
        OTHER_CPLUSPLUSFLAGS:
          - "-std=c++17"
          - "-DTJS_TEXT_OUT_CRLF"
          - "-D__STDC_CONSTANT_MACROS"
          - "-DUSE_UNICODE_FSTRING"
          - "-D_7ZIP_ST"
          - "-DLINUX"
          - "-DKR2_IOS"
        OTHER_LDFLAGS:
          - "-ObjC"
          - "-Wl,-all_load"
          - "-lc++"
          - "-lkrkr2core"
          - "-lkrkr2plugin"
          - "-lkrkr2plugin_ext"
          - "-lcocos2d"
          - "-lSDL2_image"
          - "-lSDL2_ttf"
          - "-lSDL2_mixer"
          - "-lSDL2"
          - "-lfreetype"
          - "-lvorbisfile"
          - "-lvorbis"
          - "-logg"
          - "-liconv"
          - "-lbz2"
          - "-lz"
          - "-framework"
          - "OpenAL"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "CoreAudio"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "CoreMotion"
          - "-framework"
          - "CoreBluetooth"
          - "-framework"
          - "GameController"
          - "-framework"
          - "GameKit"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "OpenGLES"
          - "-framework"
          - "GLKit"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "ImageIO"
          - "-framework"
          - "MobileCoreServices"
